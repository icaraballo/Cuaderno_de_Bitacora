<title>Mapa de viajes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Caveat:wght@600&display=swap">
<style id="app-style">
/* Concept: a framed chart board. Full-bleed SVG map, title and year chips top-left,
   logbook drawer on the right (bottom sheet on phones), boarding-pass style control bar at the bottom. */
:root{
  --bg:#e9eff2;
  --sea:#d9e6ec;
  --land:#f3f6f4;
  --visit:#c6e3da;
  --coast:#8aa5b1;
  --ink:#10222b;
  --muted:#566c77;
  --panel:#fbfcfc;
  --line:#cbd9df;
  --hair:#e2eaee;
  --plane:#2563d6;
  --bus:#c96a0a;
  --boat:#0b8a94;
  --train:#34893a;
  --car:#7c4dc4;
  --foot:#b4467a;
  --bike:#9a7400;
  --paper:#fdfdfb;
  --paper-ink:#26302d;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --font-hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --pw:340px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#07121a;--sea:#0a1820;--land:#16282f;--visit:#1e4b48;--coast:#38555f;--ink:#e8f0f3;--muted:#8fa6b0;
    --panel:#0f202a;--line:#243b46;--hair:#1a303a;--plane:#6fa3ff;--bus:#f0a24a;--boat:#3cc8d0;--train:#72cf77;--car:#b99aff;--foot:#f08cb5;--bike:#e4c34a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07121a;--sea:#0a1820;--land:#16282f;--visit:#1e4b48;--coast:#38555f;--ink:#e8f0f3;--muted:#8fa6b0;
  --panel:#0f202a;--line:#243b46;--hair:#1a303a;--plane:#6fa3ff;--bus:#f0a24a;--boat:#3cc8d0;--train:#72cf77;--car:#b99aff;--foot:#f08cb5;--bike:#e4c34a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.4;
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--plane);outline-offset:2px}
.app{position:relative;height:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--sea)}
.app.boot *{transition:none!important}
.m-plane{--mc:var(--plane)} .m-bus{--mc:var(--bus)} .m-boat{--mc:var(--boat)} .m-train{--mc:var(--train)} .m-car{--mc:var(--car)} .m-foot{--mc:var(--foot)} .m-bike{--mc:var(--bike)} .m-start{--mc:var(--muted)}

/* map */
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
#map:active{cursor:grabbing}
#map{transition:opacity .4s}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;opacity:0;transition:opacity .4s}
.app.globe-on #globe{opacity:1}
.app.globe-on #map{opacity:0}
.app.boot #globe,.app.boot #map{transition:none}
.c{fill:var(--land);stroke:none}
.c.visit{fill:var(--visit)}
.b{fill:none;stroke:var(--coast);stroke-width:.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.ghost,.leg{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.ghost{stroke:var(--mc);stroke-width:2;opacity:.22}
.leg{stroke:var(--mc);stroke-width:3}
.leg.m-bus{stroke-dasharray:9 6}
.leg.m-boat{stroke-dasharray:1 7}
.leg.m-train{stroke-dasharray:14 5 2 5}
.leg.m-car{stroke-dasharray:3 6}
.leg.m-foot{stroke-dasharray:1 5}
.leg.m-bike{stroke-dasharray:6 4}
.ghost.m-bus{stroke-dasharray:9 6}.ghost.m-boat{stroke-dasharray:1 7}.ghost.m-train{stroke-dasharray:14 5 2 5}.ghost.m-car{stroke-dasharray:3 6}.ghost.m-foot{stroke-dasharray:1 5}.ghost.m-bike{stroke-dasharray:6 4}
.ar{fill:var(--mc);stroke:var(--land);stroke-width:1.2;stroke-linejoin:round}
.pin{cursor:pointer}
.pin .hit{fill:transparent}
.pin .dot{fill:var(--ink);stroke:var(--land);stroke-width:2}
.pin.lay .dot{fill:var(--land);stroke:var(--ink);stroke-width:2}
.pin.sel .dot{fill:var(--land);stroke:var(--ink);stroke-width:3.5}
.pin .lbl{font:600 12px var(--font-body);fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.pin .halo{fill:none;stroke:var(--plane);stroke-width:3;opacity:0;pointer-events:none}
.app.editing .pin:not(.has) .halo{opacity:.55;stroke-width:1.5;stroke-dasharray:3 3}
.pin.drop .halo{opacity:1;stroke-width:3.5;stroke-dasharray:none}
.pin.drop .lbl{display:block!important;fill:var(--plane)}
.pin .pb{display:none;pointer-events:none}
.pin.has .pb{display:block}
.pb circle:first-child{fill:var(--plane);stroke:var(--land);stroke-width:1.5}
.pb rect{fill:#fff}
.pb .lens{fill:var(--plane)}
.ring{fill:none;stroke:var(--ink);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ring .9s ease-out forwards}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(3.4);opacity:0}}
.veh .vc{fill:var(--mc);stroke:var(--panel);stroke-width:2.5}
.veh .vi{fill:#fff}
.veh .vh{fill:var(--mc);opacity:.22;transform-box:fill-box;transform-origin:center;animation:vhP 1.3s ease-in-out infinite}
@keyframes vhP{0%,100%{transform:scale(.85)}50%{transform:scale(1.15)}}
.veh .vsh path{fill:#000;opacity:.3}
.veh .vp path{fill:var(--plane);stroke:var(--panel);stroke-width:1.4;paint-order:stroke}
.veh.is-plane .vg{display:none}
.veh:not(.is-plane) .vp,.veh:not(.is-plane) .vsh{display:none}
.glow{fill:none;stroke:var(--mc);stroke-width:9;stroke-opacity:.45;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;filter:url(#glowF)}
#trail circle{fill:var(--mc)}
.pin.arrv .lbl{visibility:hidden}

/* llegada: cartel */
.arr{position:absolute;left:0;top:0;width:0;height:0;z-index:3;pointer-events:none}
.arr i{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid var(--mc);border-radius:50%;opacity:0;animation:arrRing 1.15s ease-out forwards}
.arr i:nth-child(2){animation-delay:.26s}
.arr i:nth-child(3){animation-delay:.52s}
@keyframes arrRing{0%{transform:scale(1);opacity:.85}100%{transform:scale(8);opacity:0}}
.arr-t{position:absolute;left:30px;top:-42px;white-space:nowrap}
.arr.left .arr-t{left:auto;right:30px;text-align:right}
.arr-clip{overflow:hidden;padding:0 6px 3px 0}
.arr-name{display:block;font:700 40px/1.06 var(--font-display);letter-spacing:-.02em;color:var(--ink);text-shadow:0 0 2px var(--land),0 0 14px var(--land);animation:arrUp .6s cubic-bezier(.2,.9,.2,1) .15s both}
@keyframes arrUp{from{transform:translateY(108%)}to{transform:none}}
.arr-ul{height:3px;border-radius:2px;background:var(--mc);transform-origin:left;animation:arrUl .5s ease-out .42s both}
.arr.left .arr-ul{transform-origin:right}
@keyframes arrUl{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.arr-sub{display:block;margin-top:6px;font:500 12px var(--font-mono);color:var(--muted);text-shadow:0 0 2px var(--land),0 0 8px var(--land);animation:arrFade .4s ease-out .62s both}
@keyframes arrFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.arr.out{transition:opacity .25s;opacity:0}

/* header */
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-direction:column;gap:10px;pointer-events:none;transition:right .25s}
.top>*{pointer-events:auto}
.title{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 10px;max-width:100%}
h1{margin:0;font:700 22px/1.1 var(--font-display);letter-spacing:-.01em}
.stats{margin:4px 0 0;font:400 11.5px var(--font-mono);color:var(--muted);letter-spacing:.01em}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start;max-width:100%}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-weight:500;font-size:13px;line-height:1.3}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chips.sub .chip{font-size:12.5px;padding:4px 10px}
.chip small{font:400 11px var(--font-mono);opacity:.7;margin-left:4px}
/* selector de año y viaje */
.dd{position:relative;align-self:flex-start;max-width:100%}
.dd-btn{display:inline-flex;align-items:center;gap:8px;max-width:100%;border:1px solid var(--ink);background:var(--ink);color:var(--panel);border-radius:999px;padding:7px 14px 7px 16px;font:500 14px var(--font-body)}
.dd-btn b{font-weight:600;flex:none}
.dd-btn span{opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dd-btn svg{width:14px;height:14px;fill:currentColor;flex:none;transition:transform .2s}
.dd-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.dd-panel{position:absolute;left:0;top:calc(100% + 6px);width:min(310px,calc(100vw - 72px));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.18);padding:6px;z-index:6;max-height:min(62vh,440px);overflow:auto}
.opt{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:10px;border:0;background:none;color:var(--ink);text-align:left;padding:8px 10px;border-radius:8px;font:500 14px var(--font-body)}
.opt:hover,.opt:focus-visible{background:var(--hair)}
.opt small{font:400 11.5px var(--font-mono);color:var(--muted);white-space:nowrap}
.opt.on{background:var(--hair);box-shadow:inset 3px 0 0 var(--plane)}
.dd-sub{padding:2px 0 6px 12px;border-left:2px solid var(--hair);margin:0 0 4px 12px}
.dd-sub .opt{font-size:13.5px;padding:6px 10px}

/* control bar */
.bar{position:absolute;left:12px;right:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;transition:right .25s,bottom .25s}
.legline{margin:0;font:500 12px var(--font-mono);color:var(--muted);min-height:1.4em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.legline b{color:var(--ink);font-weight:500}
.legline .mi{display:inline-flex;align-items:center;gap:5px;color:var(--mc)}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ib:hover{border-color:var(--muted)}
.ib.go{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.ib svg{width:18px;height:18px;fill:currentColor}
.spd{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.spd button{border:0;background:none;padding:0 10px;height:36px;font:500 12px var(--font-mono);color:var(--muted)}
.spd button+button{border-left:1px solid var(--line)}
.spd button[aria-pressed="true"]{background:var(--hair);color:var(--ink)}
.track{display:flex;gap:3px;flex:1 1 140px;min-width:120px;align-items:center;height:38px}
.tick{flex:1 1 0;height:8px;border:0;padding:0;border-radius:4px;background:linear-gradient(to right,var(--mc) calc(var(--p,1)*100%),var(--hair) calc(var(--p,1)*100%));position:relative;transition:height .12s}
.tick::after{content:"";position:absolute;inset:-12px 0}
.tick:hover,.tick.cur{height:12px}
.tick.cur{box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--mc)}
.logbtn{border:1px solid var(--line);background:var(--panel);height:38px;border-radius:10px;padding:0 12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;flex:none}
.logbtn[aria-expanded="true"]{background:var(--hair)}
.logbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}

/* logbook drawer */
.log{position:absolute;top:0;right:0;bottom:0;width:var(--pw);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s;z-index:3;visibility:hidden}
.app.log-open .log{transform:none;visibility:visible}
.lh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px}
.lh h2{margin:0;font:700 17px var(--font-display)}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;padding:0 14px 10px;margin:0;list-style:none;font:400 11.5px var(--font-mono);color:var(--muted);border-bottom:1px solid var(--hair)}
.lg li{display:inline-flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:20px;border-top:3px solid var(--mc)}
.lg .m-bus i,.lg .m-car i,.lg .m-bike i{border-top-style:dashed}.lg .m-boat i,.lg .m-foot i{border-top-style:dotted}
#logList{flex:1;overflow:auto;padding:4px 0 20px}
.trip h3{margin:14px 14px 4px;font:700 14px var(--font-display);display:flex;flex-direction:column}
.trip h3 span{font:400 11.5px var(--font-mono);color:var(--muted);margin-top:1px}
.trip ol{list-style:none;margin:0;padding:0}
.trip li{border-top:1px solid var(--hair)}
.row{width:100%;border:0;background:none;text-align:left;display:flex;gap:10px;padding:9px 14px;align-items:flex-start}
.row:hover{background:var(--hair)}
.dot{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--mc);color:#fff;margin-top:1px}
.dot.m-start{background:none;border:2px solid var(--muted)}
.tx{display:flex;flex-direction:column;min-width:0}
.tx b{font-weight:600;font-size:14px}
.tx em{font-style:normal;color:var(--muted);font-size:12.5px}
.tx small{font:400 11.5px var(--font-mono);color:var(--muted);margin-top:2px}
.tx small .nn{font-weight:500;color:var(--ink)}
li.on .row{background:var(--hair)}
.more{padding:2px 14px 14px 48px;display:flex;flex-direction:column;gap:8px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags span{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px}
.note{margin:0;color:var(--muted);font-size:13px}
.ph{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:repeating-linear-gradient(135deg,var(--hair) 0 10px,transparent 10px 20px);display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{font:500 12px var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.ph img{cursor:zoom-in}
.ph .addph{position:absolute;right:8px;bottom:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;font-weight:500}
.ph .addph:hover{border-color:var(--muted)}
.ph .more-n{position:absolute;left:8px;bottom:8px;background:var(--ink);color:var(--panel);border-radius:999px;padding:1px 8px;font:500 11.5px var(--font-mono)}
#logList li.dz{background:var(--hair);box-shadow:inset 3px 0 0 var(--plane)}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:6px 12px;border-radius:8px;font-size:12.5px;z-index:5;max-width:80%;text-align:center}

/* banderas */
.fl{display:inline-block;flex:none;width:15px;height:10px;border-radius:2px;overflow:hidden;vertical-align:-1px;box-shadow:0 0 0 .5px rgba(0,0,0,.28)}
.trip h3 .tt{display:flex;align-items:center;gap:8px;font:inherit}
.trip h3 .fls{display:inline-flex;gap:3px;font-style:normal}
.trip h3 .fls .fl{width:17px;height:11.3px}
.tx em .fl{width:14px;height:9.4px;margin-right:6px}
.arr-sub .fl{width:16px;height:10.7px;margin-right:6px;vertical-align:-1px}
.cv-fl{display:flex;flex-wrap:wrap;gap:7px}
.cv-fl .fl{width:27px;height:18px;border-radius:3px}
.fc-f{display:flex;gap:7px;margin-top:14px;animation:arrFade .5s ease-out .5s both}
.fc-f .fl{width:30px;height:20px;border-radius:3px}
.fc-f:empty{display:none}

/* línea de tiempo */
.tlw{border-bottom:1px solid var(--hair);margin:-4px -12px 0;padding:0 0 6px}
.tl{overflow-x:auto;overflow-y:hidden;padding:0 12px;scrollbar-width:thin}
.tl-in{position:relative;height:100px}
.tl-ax{position:absolute;left:0;right:0;top:76px;height:2px;border-radius:1px;background:var(--line)}
.tl-y{position:absolute;top:69px;width:1px;height:16px;background:var(--muted);opacity:.55}
.tl-q{position:absolute;top:73px;width:1px;height:8px;background:var(--line)}
.tl-yl{position:absolute;top:83px;padding-left:5px;font:500 11px var(--font-mono);color:var(--muted)}
.tl-bar{position:absolute;top:73px;height:8px;border-radius:4px;background:var(--ink);opacity:.8}
.tl-st{position:absolute;width:1px;background:var(--line)}
.tl-t{position:absolute;display:inline-flex;align-items:center;gap:3px;height:21px;padding:0 8px 0 5px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);font:500 11.5px var(--font-body);white-space:nowrap;line-height:1}
.tl-t span{margin-left:3px}
.tl-t:hover{border-color:var(--muted);z-index:2}
.tl-t.on{background:var(--ink);color:var(--panel);border-color:var(--ink);z-index:3}
.tl-bar.on{background:var(--plane);opacity:1}
.tl-st.on{background:var(--ink)}
.tl-t.dim,.tl-bar.dim,.tl-st.dim{opacity:.35}

/* edit row */
.editrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--hair)}
.editrow p{margin:0;flex:1 1 220px;min-width:0;font-size:12.5px;color:var(--muted)}
.chip.pri{background:var(--plane);border-color:var(--plane);color:var(--bg)}
.chip:disabled{opacity:.45;cursor:default}
.app.dragging::after{content:"Suelta la foto sobre un lugar";position:absolute;inset:8px;border:2px dashed var(--plane);border-radius:10px;display:flex;align-items:flex-start;justify-content:center;padding-top:16px;font:600 14px var(--font-body);color:var(--plane);pointer-events:none;z-index:6}

/* polaroid */
.pol{position:absolute;left:0;top:0;width:188px;z-index:4;background:var(--paper);color:var(--paper-ink);padding:8px 8px 4px;border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.3),0 16px 30px rgba(0,0,0,.3);transform:rotate(var(--rot,-2deg));transform-origin:var(--tx,50%) 100%;cursor:zoom-in}
.pol.below{transform-origin:var(--tx,50%) 0}
.pol::after{content:"";position:absolute;left:var(--tx,50%);bottom:-6px;width:13px;height:13px;margin-left:-6.5px;background:var(--paper);transform:rotate(45deg);z-index:-1}
.pol.below::after{bottom:auto;top:-6px}
.pol.empty{cursor:default}
.pol-img{position:relative;aspect-ratio:4/3;background:#c9cdc6;overflow:hidden}
.pol-img img{display:block;width:100%;height:100%;object-fit:cover}
.pol-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;border:2px dashed #8d948c;font:500 12.5px var(--font-body);color:#4b544d}
.pol-cap{padding:4px 2px 2px;text-align:center;font:600 21px/1.1 var(--font-hand);min-height:28px}
.pol-nav{display:flex;align-items:center;justify-content:center;gap:10px;font:500 11.5px var(--font-mono);color:#4b544d;padding-bottom:4px}
.pol-nav button,.pol-edit button{border:1px solid #b9beb6;background:transparent;color:var(--paper-ink);border-radius:999px;font-size:12px;padding:1px 9px;line-height:1.5}
.pol-edit{display:flex;gap:6px;justify-content:center;padding:2px 0 6px}
.pol-x{position:absolute;top:-11px;right:-11px;z-index:2;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--panel);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
@keyframes polIn{0%{transform:translateY(20px) scale(.12) rotate(calc(var(--rot) - 16deg));opacity:0}55%{opacity:1}100%{transform:rotate(var(--rot)) scale(1);opacity:1}}

const fS=(pts,r,c)=>pts.map(q=>'<polygon points="'+starPts(q[0],q[1],r)+'" fill="'+c+'"/>').join('');

  '020':'<rect width="30" height="20" fill="#fedf00"/><rect width="9.4" height="20" fill="#10069f"/><rect x="20.6" width="9.4" height="20" fill="#d50032"/><rect x="13" y="7" width="4" height="5.5" rx="1" fill="#c7a034"/>',
  '156':'<rect width="30" height="20" fill="#ee1c25"/>'+fS([[5,5]],3,'#ffde00')+fS([[10,2],[12,4],[12,7],[10,9]],1,'#ffde00'),

function dateLabel(t,withYear){

/* Rutas reales de coche, bus y tren, calculadas con carreteras y vías de Natural Earth (ver build_routes.py).
   Clave: capa|lugarA|lugarB (ids en orden alfabético; road = coche y bus, rail = tren). p = lon,lat,lon,lat…; km = longitud de la ruta.
   Los tramos sin ruta (y los vuelos y barcos) se dibujan en arco. */
const ROUTES=__ROUTES__;
const ROUTE_LAYER={car:'road',bus:'road',train:'rail'};
function realRoute(mode,fromId,toId){
  const layer=ROUTE_LAYER[mode];if(!layer)return null;
  const rev=fromId>toId,r=ROUTES[layer+'|'+(rev?toId+'|'+fromId:fromId+'|'+toId)];
  if(!r)return null;
  const pts=[];for(let i=0;i<r.p.length;i+=2)pts.push(proj([r.p[i],r.p[i+1]]));
  if(rev)pts.reverse();
  return {pts:pts,km:r.km};
}
/* reparte la polilínea en n tramos iguales por longitud, para que el vehículo avance a velocidad constante */
function resample(poly,n){
  const cum=[0];
  for(let i=1;i<poly.length;i++)cum.push(cum[i-1]+Math.hypot(poly[i][0]-poly[i-1][0],poly[i][1]-poly[i-1][1]));
  const tot=cum[cum.length-1]||1,out=[];let j=1;
  for(let k=0;k<=n;k++){
    const d=tot*k/n;
    while(j<poly.length-1&&cum[j]<d)j++;
    const s=cum[j]-cum[j-1]||1,f=Math.min(1,Math.max(0,(d-cum[j-1])/s));
    out.push([poly[j-1][0]+(poly[j][0]-poly[j-1][0])*f,poly[j-1][1]+(poly[j][1]-poly[j-1][1])*f]);
  }
  return {pts:out,len:tot};
}

/* Resolver viajes: paradas y tramos con puntos en coordenadas de mapa */
const STOPS={};
TRIPS.forEach(t=>{
  t.R=t.stops.map((s,i)=>{
    const pl=PLACES[s.p];
    const o=Object.assign({},s,{id:t.id+'-'+i,trip:t,i:i,pl:pl,xy:proj(pl.ll),first:t.stops.findIndex(q=>q.p===s.p)===i});
    STOPS[o.id]=o; return o;
  });
  /* banderas del viaje: países con parada real (no escala), sin el de casa salvo que se durmiera allí */
  const home=t.R[0].pl.iso,mid=t.R.slice(1,-1).filter(s=>!s.layover),fl=[];
  mid.forEach(s=>{const iso=s.pl.iso;if(fl.indexOf(iso)>=0)return;if(iso===home&&!mid.some(q=>q.pl.iso===home&&(q.n||0)>0))return;fl.push(iso);});
  t.flags=fl.length?fl:[home];
  t.nights=t.stops.some(s=>typeof s.n==='number')?t.stops.reduce((a,s)=>a+(s.n||0)+(s.onb||0),0):null;
  t.legs=[];
  for(let i=1;i<t.R.length;i++){
    const a=t.R[i-1],b=t.R[i],mode=b.mode;
    const dx=b.xy[0]-a.xy[0],dy=b.xy[1]-a.xy[1];
    let len=Math.hypot(dx,dy)||1,pts=[],n=N,km=Math.round(d3.geoDistance(a.pl.ll,b.pl.ll)*R),real=false;
    const rr=realRoute(mode,a.p,b.p);
    if(rr){
      const poly=rr.pts;poly[0]=a.xy;poly[poly.length-1]=b.xy;
      n=Math.min(480,Math.max(N,poly.length*3));
      const rs=resample(poly,n);pts=rs.pts;len=rs.len||len;km=Math.round(rr.km);real=true;
    }else{
      let nx=-dy/len,ny=dx/len; if(ny>0){nx=-nx;ny=-ny;}
      const bulge=MODES[mode].bulge*len;
      for(let k=0;k<=N;k++){
        const u=k/N,off=Math.sin(Math.PI*u)*bulge;
        pts.push([a.xy[0]+dx*u+nx*off,a.xy[1]+dy*u+ny*off]);
      }
    }
    const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
    const mid=Math.floor(n/2),tx=pts[mid+1][0]-pts[mid-1][0],ty=pts[mid+1][1]-pts[mid-1][1];
    t.legs.push({trip:t,from:a,to:b,mode:mode,pts:pts,len:len,n:n,real:real,
      km:km,
      bbox:{x0:Math.min.apply(null,xs),x1:Math.max.apply(null,xs),y0:Math.min.apply(null,ys),y1:Math.max.apply(null,ys)},
      arrow:{x:pts[mid][0],y:pts[mid][1],rot:Math.atan2(ty,tx)*180/Math.PI+90}});
  }
});

TRIPS.forEach(t=>{
  if(t.from){const a=pd(t.from),b=pd(t.to);t.t0=Date.UTC(a.y,a.m,a.d);t.t1=Date.UTC(b.y,b.m,b.d);}
  else{const a=pd(t.ym||(t.year+'-06'));t.t0=Date.UTC(a.y,a.m,10);t.t1=t.t0+Math.max(1,t.nights||3)*DAY;}
});

const zoom=d3.zoom().scaleExtent([.4,800]).on('zoom',function(e){

svg.call(zoom).on('dblclick.zoom',null);

function pads(){
  if(coverOn)return VW>=760?{t:50,b:50,l:Math.min(Math.round(VW*.5),640)+30,r:40}:{t:40,b:40,l:20,r:20};
  if(film)return {t:96,b:92,l:48,r:48};
  const mobile=VW<760,pr=(panelOpen&&!mobile)?PANEL_W+16:0,pb=(panelOpen&&mobile)?VH*.44:0;
  return {t:mobile?124:122,b:(mobile?150:104)+pb+(editing?46:0)+(tlOn?112:0),l:36,r:84+pr};
}
function viewFor(bb,opt){
  const p=pads(),aw=Math.max(VW-p.l-p.r,100),ah=Math.max(VH-p.t-p.b,100);
  const w=Math.max(bb.x1-bb.x0,1e-3),h=Math.max(bb.y1-bb.y0,1e-3);
  let k=Math.min(aw/w,ah/h);k=Math.min(Math.max(k,opt.minK),opt.maxK);
  const cx=(bb.x0+bb.x1)/2,cy=(bb.y0+bb.y1)/2;
  return d3.zoomIdentity.translate(p.l+aw/2-cx*k,p.t+ah/2-cy*k).scale(k);
}
function fly(t,ms){
  if(RM)ms=0;
  return svg.transition().duration(ms).ease(d3.easeCubicInOut).call(zoom.transform,t).end().catch(function(){});
}
function scopeBox(){
  const xs=S.pins.map(p=>p.x),ys=S.pins.map(p=>p.y);
  return {x0:Math.min.apply(null,xs),x1:Math.max.apply(null,xs),y0:Math.min.apply(null,ys),y1:Math.max.apply(null,ys)};
}
function fitScope(ms){
  const t=viewFor(scopeBox(),{minK:.5,maxK:14});
  if(ms===0)svg.call(zoom.transform,t);else fly(t,ms);
}
function pointBox(xy){return {x0:xy[0],x1:xy[0],y0:xy[1],y1:xy[1]};}

function drawBase(){
  gLand.selectAll('path.c').data(world).join('path').attr('class','c').attr('d',geoPath);
  gLand.selectAll('path.b').data([borders]).join('path').attr('class','b').attr('d',geoPath);
}
const lineD=pts=>'M'+pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join('L');

function setScope(first){
  stopPlayback();hidePol();
  S.trips=TRIPS.filter(t=>(year===null||t.year===year)&&(tripId==='all'||t.id===tripId));
  S.legs=[].concat.apply([],S.trips.map(t=>t.legs));
  const stops=[].concat.apply([],S.trips.map(t=>t.R)),m=new Map();
  stops.forEach(s=>{
    let p=m.get(s.p);
    if(!p){p={key:s.p,pl:s.pl,x:s.xy[0],y:s.xy[1],visits:[],lay:true,prio:0};m.set(s.p,p);}
    p.visits.push(s);if(!s.layover)p.lay=false;
  });
  S.pins=Array.from(m.values());
  S.pins.forEach(p=>{p.prio=p.visits.length+(p.lay?0:20)+(p.key==='bilbao'?5:0);});
  S.visit=new Set(stops.filter(s=>!s.layover).map(s=>s.pl.iso));
  activeSid=null;

  gLand.selectAll('path.c').classed('visit',d=>S.visit.has(d.id));
  gGhost.selectAll('path').data(S.legs).join('path').attr('class',d=>'ghost m-'+d.mode).attr('d',d=>lineD(d.pts));
  gLegs.selectAll('path').data(S.legs).join('path').attr('class',d=>'leg m-'+d.mode).attr('d',d=>lineD(d.pts));
  gArr.selectAll('path').data(S.legs).join('path').attr('class',d=>'ar sc m-'+d.mode).attr('d','M0,-7L6,6L0,3L-6,6Z');
  const pg=gPins.selectAll('g.pin').data(S.pins,d=>d.key).join(enter=>{
    const g=enter.append('g').attr('class','pin');
    g.append('circle').attr('class','hit').attr('r',14);
    g.append('circle').attr('class','halo').attr('r',12);
    g.append('circle').attr('class','dot').attr('r',5.5);
    const b=g.append('g').attr('class','pb').attr('transform','translate(9,-9)');
    b.append('circle').attr('r',7);
    b.append('rect').attr('x',-3.4).attr('y',-2.4).attr('width',6.8).attr('height',4.8).attr('rx',1);
    b.append('circle').attr('class','lens').attr('r',1.4);
    g.append('text').attr('class','lbl').attr('x',10).attr('y',4);
    return g;
  });
  pg.classed('lay',d=>d.lay).each(function(d){d.el=d3.select(this);}).select('text').text(d=>d.pl.n);
  pg.on('click',function(e,d){
    if(film)return;
    selectStop((d.visits.find(v=>v.first&&!v.layover)||d.visits[0]).id);
  });
  markPh();
  buildTrack();renderHeader();renderLog();setAllLegs(1);updateBar();
  updateScale();
  fitScope(first?0:1000);
}

function updateScale(){
  const k=cur.k;
  gPins.selectAll('g.pin').attr('transform',d=>'translate('+d.x+','+d.y+') scale('+(1/k)+')');
  gArr.selectAll('path').attr('transform',d=>'translate('+d.arrow.x+','+d.arrow.y+') rotate('+d.arrow.rot+') scale('+(1/k)+')');
  applyVeh();scheduleCull();placePol();placeArr();
  glowB.setAttribute('stdDeviation',(3.5/k).toFixed(4));
}
let cullQ=false;
function scheduleCull(){if(cullQ)return;cullQ=true;requestAnimationFrame(function(){cullQ=false;cull();});}
function cull(){
  const live=film?S.pins.filter(d=>d.seen):S.pins,k=cur.k,rects=[],dots=live.map(d=>[cur.x+d.x*k-8,cur.y+d.y*k-8,16,16]);
  live.slice().sort((a,b)=>b.prio-a.prio).forEach(function(d,idx){
    const sx=cur.x+d.x*k+8,sy=cur.y+d.y*k-9,w=d.pl.n.length*6.7+8,h=17;
    const clash=r=>sx<r[0]+r[2]&&sx+w>r[0]&&sy<r[1]+r[3]&&sy+h>r[1];
    const hit=rects.some(clash)||dots.some((r,j)=>live[j]!==d&&clash(r));
    if(!hit)rects.push([sx,sy,w,h]);
    if(d.el)d.el.select('text').style('display',hit?'none':null);
  });
}
function markPins(){gPins.selectAll('g.pin').classed('sel',d=>!!activeSid&&d.visits.some(v=>v.id===activeSid));}

/* ───────────────────────── VEHÍCULO ───────────────────────── */
let veh={x:0,y:0,rot:0,mode:'plane',on:false};
function applyVeh(){
  if(!veh.on)return;
  gVeh.attr('transform','translate('+veh.x+','+veh.y+') scale('+(1/cur.k)+')');
}
function showVeh(mode){
  veh.mode=mode;veh.on=true;
  gVeh.style('display',null).attr('class','veh m-'+mode+(mode==='plane'?' is-plane':''));
  $('#vicon').innerHTML='<g transform="translate(-9,-9) scale(.75)" fill-rule="evenodd">'+ICON[mode]+'</g>';
}
function hideVeh(){veh.on=false;gVeh.style('display','none');hideFx();}
const glowEl=document.getElementById('glow'),glowB=document.getElementById('glowB');
const gTrail=gWorld.select('#trail');
for(let i=0;i<10;i++)gTrail.append('circle').attr('r',0);
const trailC=gTrail.selectAll('circle').nodes();
function hideFx(){glowEl.style.display='none';trailC.forEach(c=>c.setAttribute('r',0));}
function ptAt(L,u){
  u=Math.max(0,Math.min(1,u));const n=L.n,f=u*n,m=Math.min(Math.floor(f),n-1),fr=f-m;
  return [L.pts[m][0]+(L.pts[m+1][0]-L.pts[m][0])*fr,L.pts[m][1]+(L.pts[m+1][1]-L.pts[m][1])*fr];
}

/* ───────────────────────── TRAMOS ───────────────────────── */
function setLeg(i,t){
  const L=S.legs[i];if(!L)return;
  const n=L.n,f=t*n,m=Math.min(Math.floor(f),n-1),fr=f-m;
  let pts=L.pts.slice(0,m+1);
  if(t>0){pts.push([L.pts[m][0]+(L.pts[m+1][0]-L.pts[m][0])*fr,L.pts[m][1]+(L.pts[m+1][1]-L.pts[m][1])*fr]);}
  else pts=[L.pts[0],L.pts[0]];
  const last=pts[pts.length-1],prev=pts[Math.max(0,pts.length-2)];
  gLegs.selectAll('path').filter(d=>d===L).attr('d',lineD(pts));
  gArr.selectAll('path').filter(d=>d===L).style('display',t>=.5?null:'none');
  const tk=document.querySelectorAll('#track .tick')[i];
  if(tk)tk.style.setProperty('--p',t);
  if(veh.on&&curLeg===i){
    veh.x=last[0];veh.y=last[1];
    if(last[0]!==prev[0]||last[1]!==prev[1])veh.rot=Math.atan2(last[1]-prev[1],last[0]-prev[0])*180/Math.PI+90;
    if(veh.mode==='plane'){
      const h=Math.sin(Math.PI*t),alt=h*16,sc=1.15+h*.55;
      gVeh.select('.vp').attr('transform','translate(0,'+(-alt)+') rotate('+veh.rot+') scale('+sc+')');
      gVeh.select('.vsh').attr('transform','translate('+(alt*.6)+','+(alt*.35)+') rotate('+veh.rot+') scale('+(1.1-h*.1)+')');
      glowEl.style.display='none';
    }else{
      glowEl.setAttribute('d',lineD(pts));glowEl.setAttribute('class','glow m-'+L.mode);glowEl.style.display=t>0&&t<1?null:'none';
      const k=cur.k,step=7/Math.max(L.len*k,1);
      trailC.forEach(function(c,j){
        const n=j+1,u=t-n*step,on=t>0&&t<1&&u>0;
        if(!on){c.setAttribute('r',0);return;}
        const q=ptAt(L,u);c.setAttribute('cx',q[0]);c.setAttribute('cy',q[1]);
        c.setAttribute('r',(4.2*(1-n/11))/k);c.setAttribute('opacity',.55*(1-n/11));c.setAttribute('class','m-'+L.mode);
      });
    }
    applyVeh();
  }
}
function setAllLegs(t){S.legs.forEach((_,i)=>setLeg(i,t));document.querySelectorAll('#track .tick').forEach(x=>x.classList.remove('cur'));}

}
function updateBar(){
  $('#btnPlay').innerHTML=(playing&&!paused)?PAUSE:PLAY;
  $('#btnPlay').setAttribute('aria-label',(playing&&!paused)?'Pausar':'Reproducir');
  $('#fPlay').innerHTML=(playing&&!paused)?PAUSE:PLAY;
  $('#fPlay').setAttribute('aria-label',(playing&&!paused)?'Pausar':'Reproducir');

  else{

    lb.innerHTML='<span>Pulsa ▶ para ver el recorrido · '+S.legs.length+' tramos · ~'+fmt(km)+' km</span>';
  }
}
function buildTrack(){
  const tr=$('#track');tr.innerHTML='';

/* Cámara del avión: sigue la trayectoria de zoom óptima de d3 (van Wijk) entre el origen y el destino:
   despega cerca, se abre a mitad de vuelo para enseñar el tramo entero y se vuelve a acercar al aterrizar.
   El avión va atado a la cámara (siempre a su altura sobre la línea origen–destino), así que no puede bailar ni salirse del encuadre. */
const PLAY_MAXK=520;
function legView(L){
  const p=pads(),aw=Math.max(VW-p.l-p.r,100),ah=Math.max(VH-p.t-p.b,100);
  const kFar=viewFor(L.bbox,{minK:.5,maxK:PLAY_MAXK}).k;
  return {aw:aw,ah:ah,m:Math.min(aw,ah),ax:p.l+aw/2,ay:p.t+ah/2,kNear:Math.min(PLAY_MAXK,kFar*2.3)};
}
const camAt=(V,x,y,k)=>d3.zoomIdentity.translate(V.ax-x*k,V.ay-y*k).scale(k);
function planeRig(L,V){
  const A=L.pts[0],B=L.pts[L.n],dx=B[0]-A[0],dy=B[1]-A[1],d2=dx*dx+dy*dy||1,w=V.m/V.kNear;
  const zi=d3.interpolateZoom.rho(1.6)([A[0],A[1],w],[B[0],B[1],w]);
  const fr=L.pts.map(q=>((q[0]-A[0])*dx+(q[1]-A[1])*dy)/d2);
  for(let k=1;k<fr.length;k++)if(fr[k]<fr[k-1])fr[k]=fr[k-1];
  return function(e){
    const c=zi(e),f=Math.min(1,Math.max(0,((c[0]-A[0])*dx+(c[1]-A[1])*dy)/d2));
    let lo=0,hi=fr.length-1;
    while(hi-lo>1){const mid=(lo+hi)>>1;if(fr[mid]<=f)lo=mid;else hi=mid;}
    const span=fr[hi]-fr[lo],u=(lo+(span>0?(f-fr[lo])/span:0))/L.n;
    return {u:Math.min(1,Math.max(0,u)),t:camAt(V,c[0],c[1],V.m/c[2])};
  };
}
function animateLeg(i,tok,V){
  return new Promise(function(res){
    const L=S.legs[i],dur=(1000+L.len*9)/speed,rig=V?planeRig(L,V):null;
    let last=performance.now(),el=0;
    function step(now){
      if(tok!==runTok){res();return;}
      const dt=now-last;last=now;if(!paused)el+=dt;
      const t=Math.min(1,el/dur),e=d3.easeSinInOut(t);
      let u=e;
      if(rig){const r=rig(e);u=r.u;if(!paused)svg.call(zoom.transform,r.t);}
      setLeg(i,u);if(legHook)legHook(u);
      if(t<1)requestAnimationFrame(step);else res();
    }
    requestAnimationFrame(step);
  });
}
/* encuadre antes de cada tramo: el avión arranca con la vista cerca del origen; el resto, con el tramo entero */
function legStart(L){
  if(L.mode==='plane'&&!RM){const V=legView(L);return {V:V,t:camAt(V,L.pts[0][0],L.pts[0][1],V.kNear)};}
  return {V:null,t:viewFor(L.bbox,{minK:.5,maxK:PLAY_MAXK})};
}
async function play(from){
  if(!S.legs.length)return;
  const tok=++runTok;playing=true;paused=false;
  S.legs.forEach((_,i)=>setLeg(i,i<from?1:0));
  updateBar();
  for(let i=from;i<S.legs.length;i++){
    if(tok!==runTok)return;
    const L=S.legs[i];curLeg=i;
    document.querySelectorAll('#track .tick').forEach((x,j)=>x.classList.toggle('cur',j===i));
    activeSid=L.from.id;renderLog();markPins();scrollLog(activeSid);
    hidePol();hideArr();
    showVeh(L.mode);veh.x=L.pts[0][0];veh.y=L.pts[0][1];
    veh.rot=Math.atan2(L.pts[1][1]-L.pts[0][1],L.pts[1][0]-L.pts[0][0])*180/Math.PI+90;setLeg(i,0);
    updateBar();
    const ls=legStart(L);
    await fly(ls.t,Math.max(450,1100/speed));
    if(tok!==runTok)return;
    await animateLeg(i,tok,ls.V?legView(L):null);
    if(tok!==runTok)return;
    hideFx();
    activeSid=L.to.id;renderLog();markPins();scrollLog(activeSid);
    showArr(L);
    const withPhoto=hasPh(L.to.p);
    if(withPhoto){await sleep(Math.max(500,900/speed));if(tok!==runTok)return;showPol(L.to.p);}
    await sleep((withPhoto?Math.max(1400,2200/speed):Math.max(800,1500/speed))+stayMs(L.to));
  }
  if(tok===runTok){
    hidePol();hideArr();
    playing=false;paused=false;curLeg=-1;hideVeh();
    document.querySelectorAll('#track .tick').forEach(x=>x.classList.remove('cur'));
    updateBar();
    fitScope(1300);
  }
}

/* ───────────────────────── GLOBO ─────────────────────────
   Globo ligero (d3, proyección ortográfica en canvas 2D). Gira detrás de la portada y, en la película,
   hace los vuelos largos: arranca con el mismo encuadre que el mapa plano, se aleja para ver el tramo entero
   y al aterrizar vuelve al mapa plano en el mismo sitio y con el mismo zoom.
   De lejos usa el mapa sencillo (TOPO_LO, 110m); de cerca, el detallado (TOPO, 50m) y solo los países a la vista. */
const GLOBE_KM=2500;
const gcv=document.getElementById('globe'),gctx=gcv.getContext('2d');
const gproj=d3.geoOrthographic().clipAngle(90).precision(.4),gpath=d3.geoPath(gproj,gctx),ggrat=d3.geoGraticule10();
const PLANE2D=new Path2D('M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z');
let GLO=null,GHI=null,gCol={},gRaf=0,gLast=0,gDpr=1;
const G={on:false,auto:false,rot:[0,-28],R:300,cx:0,cy:0,legs:[],cur:null,u:0,visit:new Set(),places:[],arc:null};
function gLevel(T,obj){
  const fs=topojson.feature(T,T.objects[obj]).features;
  fs.forEach(f=>{f.c=d3.geoCentroid(f);let r=0;
    const walk=a=>{if(typeof a[0]==='number'){const d=d3.geoDistance(f.c,a);if(d>r)r=d;}else a.forEach(walk);};
    walk(f.geometry.coordinates);f.r=r;});
  return {fs:fs,borders:topojson.mesh(T,T.objects[obj],(a,b)=>a!==b)};
}
function gReady(hi){if(!GLO)GLO=gLevel(TOPO_LO,'countries');if(hi&&!GHI)GHI=gLevel(TOPO,'countries');}
function gColors(){
  const cs=getComputedStyle(appEl);
  ['sea','land','visit','coast','ink','muted','panel','plane','bus','boat','train','car','foot','bike','line'].forEach(k=>{gCol[k]=cs.getPropertyValue('--'+k).trim();});
}
function gSize(){
  gDpr=Math.min(2,window.devicePixelRatio||1);
  gcv.width=Math.round(VW*gDpr);gcv.height=Math.round(VH*gDpr);
}
/* geometría de un tramo en lon/lat: ruta real si la hay, si no círculo máximo */
function legGeo(L){
  if(L.geo)return L.geo;
  const layer=ROUTE_LAYER[L.mode];let c=null;
  if(layer){const a=L.from.p,b=L.to.p,rev=a>b,r=ROUTES[layer+'|'+(rev?b+'|'+a:a+'|'+b)];
    if(r){c=[];for(let i=0;i<r.p.length;i+=2)c.push([r.p[i],r.p[i+1]]);if(rev)c.reverse();}}
  L.geo={type:'LineString',coordinates:c||[L.from.pl.ll,L.to.pl.ll]};
  return L.geo;
}
function gFront(ll){return d3.geoDistance(ll,[-G.rot[0],-G.rot[1]])<Math.PI/2-.01;}
function gDraw(){
  const W=VW,H=VH,R=G.R;
  gctx.setTransform(gDpr,0,0,gDpr,0,0);gctx.clearRect(0,0,W,H);
  gproj.translate([G.cx,G.cy]).scale(R).rotate([G.rot[0],G.rot[1]]);
  // halo
  const halo=gctx.createRadialGradient(G.cx,G.cy,R*.96,G.cx,G.cy,R*1.12);
  halo.addColorStop(0,gCol.coast);halo.addColorStop(1,'rgba(0,0,0,0)');
  gctx.globalAlpha=.35;gctx.fillStyle=halo;gctx.beginPath();gctx.arc(G.cx,G.cy,R*1.12,0,Math.PI*2);gctx.fill();gctx.globalAlpha=1;
  // océano y retícula
  gctx.beginPath();gctx.arc(G.cx,G.cy,R,0,Math.PI*2);gctx.fillStyle=gCol.sea;gctx.fill();
  gctx.beginPath();gpath(ggrat);gctx.strokeStyle=gCol.coast;gctx.globalAlpha=.28;gctx.lineWidth=.6;gctx.stroke();gctx.globalAlpha=1;
  // tierra
  const hi=R>Math.min(W,H)*1.3;gReady(hi);
  const Lv=hi?GHI:GLO,c0=[-G.rot[0],-G.rot[1]],view=Math.min(Math.PI/2,Math.asin(Math.min(1,Math.hypot(W,H)/2/R))+.05);
  const vf=hi?Lv.fs.filter(f=>d3.geoDistance(f.c,c0)-f.r<view):Lv.fs;
  gctx.beginPath();vf.forEach(f=>{if(!G.visit.has(f.id))gpath(f);});gctx.fillStyle=gCol.land;gctx.fill();
  gctx.beginPath();vf.forEach(f=>{if(G.visit.has(f.id))gpath(f);});gctx.fillStyle=gCol.visit;gctx.fill();
  gctx.beginPath();if(hi)vf.forEach(f=>gpath(f));else gpath(Lv.borders);gctx.strokeStyle=gCol.coast;gctx.lineWidth=.6;gctx.stroke();
  gctx.beginPath();gctx.arc(G.cx,G.cy,R,0,Math.PI*2);gctx.strokeStyle=gCol.coast;gctx.lineWidth=1;gctx.stroke();
  // rutas
  gctx.lineCap='round';gctx.lineJoin='round';
  G.legs.forEach(L=>{gctx.beginPath();gpath(legGeo(L));gctx.strokeStyle=gCol[L.mode]||gCol.plane;gctx.globalAlpha=G.cur?.9:.6;gctx.lineWidth=G.cur?2.2:1.4;gctx.stroke();});
  gctx.globalAlpha=1;
  if(G.cur&&G.arc){
    const n=64,pts=[];for(let k=0;k<=n;k++)pts.push(G.arc(G.u*k/n));
    gctx.beginPath();gpath({type:'LineString',coordinates:pts});gctx.strokeStyle=gCol.plane;gctx.lineWidth=3;gctx.stroke();
  }
  // lugares
  G.places.forEach(ll=>{if(!gFront(ll))return;const p=gproj(ll);gctx.beginPath();gctx.arc(p[0],p[1],3.4,0,Math.PI*2);gctx.fillStyle=gCol.ink;gctx.fill();gctx.lineWidth=1.6;gctx.strokeStyle=gCol.land;gctx.stroke();});
  // avión, con altura y sombra
  if(G.cur&&G.arc&&G.u<1){
    const ll=G.arc(G.u),p=gproj(ll),q=gproj(G.arc(Math.min(1,G.u+.01)));
    if(p&&q){
      const ang=Math.atan2(q[1]-p[1],q[0]-p[0])+Math.PI/2,h=Math.sin(Math.PI*G.u);
      gctx.save();gctx.translate(p[0]+h*10,p[1]+h*6);gctx.rotate(ang);gctx.scale(1.1,1.1);gctx.translate(-12,-12);gctx.fillStyle='rgba(0,0,0,.28)';gctx.fill(PLANE2D);gctx.restore();
      gctx.save();gctx.translate(p[0],p[1]-h*16);gctx.rotate(ang);gctx.scale(1.15+h*.55,1.15+h*.55);gctx.translate(-12,-12);
      gctx.lineWidth=1.4;gctx.strokeStyle=gCol.panel;gctx.stroke(PLANE2D);gctx.fillStyle=gCol.plane;gctx.fill(PLANE2D);gctx.restore();
    }
  }
}
function gLoop(now){
  if(!G.on){gRaf=0;return;}
  const dt=Math.min(64,now-(gLast||now));gLast=now;
  if(G.auto&&!RM)G.rot[0]+=dt*.005;
  gDraw();gRaf=requestAnimationFrame(gLoop);
}
function gShow(on){
  if(on===G.on)return;
  G.on=on;appEl.classList.toggle('globe-on',on);
  if(on){gColors();gSize();gLast=0;if(!gRaf)gRaf=requestAnimationFrame(gLoop);}
}
const gScaleFor=(k,lat)=>160*k/Math.cos(lat*Math.PI/180);
/* portada: el globo con todos los viajes, a la derecha en pantallas anchas */
function coverGlobe(){
  const p=pads(),wide=VW>=760;
  G.cx=wide?p.l+(VW-p.l-p.r)/2:VW/2;G.cy=VH/2;
  G.R=Math.min(wide?(VW-p.l-p.r):VW,VH)*(wide?.4:.42);
  G.legs=S.legs.slice();G.cur=null;G.arc=null;G.visit=new Set(S.visit);
  G.places=S.pins.map(q=>q.pl.ll);
  if(!G.on)G.rot=[2,-28];
  G.auto=true;gShow(true);
}
/* película: vuelo largo en el globo. V = legView(L) del mapa plano; devuelve true si terminó */
async function globeFlight(L,i,tok,V){
  const a=L.from.pl.ll,b=L.to.pl.ll,dist=d3.geoDistance(a,b),gi=d3.geoInterpolate(a,b);
  const R0=gScaleFor(cur.k,a[1]),R1=gScaleFor(V.kNear,b[1]),m=Math.min(V.aw,V.ah);
  const Rmid=Math.min(R0,R1,Math.max(m*.4,m*.42/Math.sin(Math.min(dist/2,1.4))));
  G.cx=V.ax;G.cy=V.ay;G.R=R0;G.rot=[-a[0],-a[1]];G.auto=false;
  G.legs=S.legs.filter((_,j)=>j<i);G.cur=L;G.arc=gi;G.u=0;G.visit=new Set(filmVisit);
  G.places=S.pins.filter(q=>q.seen).map(q=>q.pl.ll);
  hideVeh();gShow(true);
  await sleep(RM?0:420);
  const dur=(1000+L.len*9)/speed;
  const ok=await new Promise(function(res){
    let last=performance.now(),el=0;
    (function step(now){
      if(tok!==runTok){res(false);return;}
      const dt=now-last;last=now;if(!paused)el+=dt;
      const t=Math.min(1,el/dur),e=d3.easeSinInOut(t),ll=gi(e),h=Math.pow(Math.sin(Math.PI*e),.85);
      const lr=Math.log(R0)+(Math.log(R1)-Math.log(R0))*e;
      G.u=e;G.rot=[-ll[0],-ll[1]];G.R=Math.exp(lr+(Math.log(Rmid)-lr)*h);
      setLeg(i,e);if(legHook)legHook(e);
      if(t<1)requestAnimationFrame(step);else res(true);
    })(last);
  });
  if(!ok)return false;
  G.u=1;
  svg.call(zoom.transform,camAt(V,L.to.xy[0],L.to.xy[1],V.kNear));
  gShow(false);G.cur=null;
  await sleep(RM?0:420);
  return tok===runTok;
}

function totals(trips){
  const legs=[].concat.apply([],trips.map(t=>t.legs)),km=legs.reduce((a,l)=>a+l.km,0),iso=new Set(),pl=new Set();
  trips.forEach(t=>t.R.forEach(s=>{pl.add(s.p);if(!s.layover)iso.add(s.pl.iso);}));
  const nn=trips.map(t=>t.nights);
  return {iso:Array.from(iso),trips:trips.length,places:pl.size,countries:iso.size,km:km,laps:km/EARTH,legs:legs.length,
          nights:(nn.length&&nn.every(n=>typeof n==='number'))?nn.reduce((a,b)=>a+b,0):null};
}
function countUp(el,to,dec,ms){
  if(!el)return;
  const t0=performance.now();el._cu=t0;
  if(RM||!ms){el.textContent=nf(to,dec);return;}
  (function f(now){
    if(el._cu!==t0)return;
    const u=Math.min(1,Math.max(0,(now-t0)/ms)),e=1-Math.pow(1-u,3);
    el.textContent=nf(to*e,dec);
    if(u<1)requestAnimationFrame(f);
  })(t0);
}

async function playFilm(){
  const tok=++runTok;playing=true;paused=false;curLeg=-1;
  appEl.classList.remove('ended');fend.hidden=true;
  hideVeh();hideArr();hidePol();
  filmVisit=new Set();
  S.pins.forEach(p=>{p.seen=false;});
  gPins.selectAll('g.pin').classed('seen',false);
  gLand.selectAll('path.c').classed('visit',false);
  filmSeg.forEach(s=>s.style.setProperty('--p',0));
  setAllLegs(0);
  $('#fCo').textContent='0';$('#fCoL').textContent='países';$('#fKm').textContent='0';
  updateBar();scheduleCull();kickIdle();
  let idx=0,doneKm=0;
  await sleep(400);
  for(let ti=0;ti<S.trips.length;ti++){
    const t=S.trips[ti];
    if(tok!==runTok)return;
    $('#fYear').textContent=dateLabel(t);$('#fTrip').textContent=t.title;
    showCard(t);
    await fly(viewFor(tripBox(t),{minK:.5,maxK:14}),Math.max(800,1500/speed));
    if(tok!==runTok)return;
    await sleep(Math.max(500,900/speed));await hold(tok);
    if(tok!==runTok)return;
    hideCard();
    for(let j=0;j<t.legs.length;j++,idx++){
      if(tok!==runTok)return;
      const L=t.legs[j],i=idx;curLeg=i;
      filmSeen(L.from);hidePol();hideArr();
      showVeh(L.mode);veh.x=L.pts[0][0];veh.y=L.pts[0][1];
      veh.rot=Math.atan2(L.pts[1][1]-L.pts[0][1],L.pts[1][0]-L.pts[0][0])*180/Math.PI+90;setLeg(i,0);
      const ls=legStart(L);
      await fly(ls.t,Math.max(400,900/speed));await hold(tok);
      if(tok!==runTok)return;
      legHook=function(e){
        $('#fKm').textContent=fmt(Math.round(doneKm+L.km*e));
        filmSeg[ti].style.setProperty('--p',((j+e)/t.legs.length).toFixed(3));
      };
      if(L.mode==='plane'&&L.km>=GLOBE_KM&&!RM){if(!(await globeFlight(L,i,tok,legView(L)))){legHook=null;return;}}
      else await animateLeg(i,tok,ls.V?legView(L):null);
      legHook=null;
      if(tok!==runTok)return;
      hideFx();doneKm+=L.km;$('#fKm').textContent=fmt(doneKm);
      filmSeen(L.to);showArr(L);
      const withPhoto=hasPh(L.to.p);
      if(withPhoto){await sleep(Math.max(400,800/speed));if(tok!==runTok)return;showPol(L.to.p);}
      await sleep((withPhoto?Math.max(1200,2000/speed):Math.max(450,900/speed))+stayMs(L.to));await hold(tok);
    }
    filmSeg[ti].style.setProperty('--p',1);
  }
  if(tok!==runTok)return;
  hidePol();hideArr();hideVeh();curLeg=-1;playing=false;paused=false;updateBar();
  await fly(viewFor(scopeBox(),{minK:.5,maxK:14}),1300);
  if(tok!==runTok)return;
  showEnd();
}
function enterFilm(y,tid){
  if(film)return;
  const wasCover=coverOn;
  filmPrev={year:year,tripId:tripId,panel:wasCover?coverPrevPanel:panelOpen,speed:speed};
  if(wasCover)dropCover();
  stopPlayback();hidePol();setDD(false);
  film=true;year=y;tripId=tid||'all';panelOpen=false;
  appEl.classList.add('film');appEl.classList.remove('log-open','ended','idle');
  $('#btnLog').setAttribute('aria-expanded','false');
  speed=2;syncSpd();
  try{if(appEl.requestFullscreen){fsOn=true;appEl.requestFullscreen().catch(function(){fsOn=false;});}}catch(e){fsOn=false;}
  measure();
  setScope(false);
  buildFilmSeg();
  playFilm();
}
function exitFilm(){
  if(!film)return;
  runTok++;playing=false;paused=false;curLeg=-1;legHook=null;film=false;
  clearTimeout(idleT);clearTimeout(cardT);gShow(false);
  hideVeh();hideArr();hidePol();fcard.hidden=true;fend.hidden=true;
  appEl.classList.remove('film','idle','ended');
  if(fsOn&&document.fullscreenElement){fsOn=false;try{document.exitFullscreen().catch(function(){});}catch(e){}}
  fsOn=false;
  speed=filmPrev.speed;syncSpd();
  year=filmPrev.year;tripId=filmPrev.tripId;panelOpen=filmPrev.panel;
  appEl.classList.toggle('log-open',panelOpen);$('#btnLog').setAttribute('aria-expanded',String(panelOpen));
  measure();
  setScope(false);
}
function filmToggle(){
  if(!film)return;
  if(!playing){playFilm();return;}
  paused=!paused;updateBar();
}
document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&film&&fsOn){fsOn=false;exitFilm();}});
$('#btnFilm').addEventListener('click',function(){enterFilm(year,tripId);});
$('#fPlay').addEventListener('click',filmToggle);
$('#fExitBtn').addEventListener('click',exitFilm);

/* ───────────────────────── LÍNEA DE TIEMPO ───────────────────────── */
const tlw=$('#tlw'),tlBox=$('#tl');
function buildTl(){
  if(!tlOn)return;
  const ys=TRIPS.map(t=>t.year),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
  const T0=Date.UTC(y0,0,1),T1=Date.UTC(y1+1,0,1),W=Math.max(tlBox.clientWidth-24,960),pl=6,pr=6;
  const X=ms=>pl+(ms-T0)/(T1-T0)*(W-pl-pr),ROW=[2,25,48],AX=76,ends=[-1e9,-1e9,-1e9];
  let h='<div class="tl-in" style="width:'+W+'px"><div class="tl-ax"></div>';
  for(let y=y0;y<=y1+1;y++){
    const x=X(Date.UTC(y,0,1));h+='<i class="tl-y" style="left:'+x.toFixed(1)+'px"></i>';
    if(y<=y1){h+='<span class="tl-yl" style="left:'+x.toFixed(1)+'px">'+y+'</span>';for(let q=3;q<12;q+=3)h+='<i class="tl-q" style="left:'+X(Date.UTC(y,q,1)).toFixed(1)+'px"></i>';}
  }
  TRIPS.slice().sort((a,b)=>a.t0-b.t0).forEach(function(t){
    const x=X(t.t0),w=Math.max(4,X(t.t1)-x),name=t.short||t.title;
    const lw=t.flags.length*18+name.length*6.3+20,L=Math.min(Math.max(x-6,0),W-lw);
    let r=ends.findIndex(e=>e+6<=L);if(r<0)r=ends.indexOf(Math.min.apply(null,ends));ends[r]=L+lw;
    const cls=(tripId===t.id?' on':'')+(year!==null&&t.year!==year?' dim':'');
    h+='<i class="tl-st'+cls+'" style="left:'+(x+1).toFixed(1)+'px;top:'+(ROW[r]+20)+'px;height:'+(AX-ROW[r]-20)+'px"></i>'+
       '<i class="tl-bar'+cls+'" style="left:'+x.toFixed(1)+'px;width:'+w.toFixed(1)+'px"></i>'+
       '<button class="tl-t'+cls+'" type="button" data-t="'+t.id+'" style="left:'+L.toFixed(1)+'px;top:'+ROW[r]+'px" title="'+t.title+' · '+dateLabel(t)+'" aria-label="'+t.title+', '+dateLabel(t)+'" aria-pressed="'+(tripId===t.id)+'">'+flags(t.flags)+'<span>'+name+'</span></button>';
  });
  tlBox.innerHTML=h+'</div>';
  const on=tlBox.querySelector('.tl-t.on')||(year!==null?tlBox.querySelector('.tl-t:not(.dim)'):null);
  if(on)tlBox.scrollLeft=Math.max(0,on.offsetLeft-tlBox.clientWidth/2+on.offsetWidth/2);
  else tlBox.scrollLeft=tlBox.scrollWidth;
}
function setTl(on){
  tlOn=!!on;tlw.hidden=!tlOn;$('#btnTl').setAttribute('aria-pressed',String(tlOn));
  buildTl();if(!playing&&S.pins.length)fitScope(600);
}
$('#btnTl').addEventListener('click',function(){setTl(!tlOn);});
tlBox.addEventListener('click',function(e){
  const b=e.target.closest('.tl-t');if(!b)return;
  const t=TRIPS.find(q=>q.id===b.dataset.t);if(!t)return;
  if(tripId===t.id){year=null;tripId='all';}else{year=t.year;tripId=t.id;}
  setDD(false);setScope(false);
});

document.querySelectorAll('.spd button').forEach(b=>b.addEventListener('click',function(){

}));
function setPanel(open){
  panelOpen=open;
  $('#app').classList.toggle('log-open',open);

function measure(){
  const r=$('#app').getBoundingClientRect();VW=r.width;VH=r.height;
  svg.attr('width',VW).attr('height',VH);
  zoom.extent([[0,0],[VW,VH]]);
  if(G.on){gSize();if(coverOn)coverGlobe();}
}
let rsT=0;
new ResizeObserver(function(){
  measure();clearTimeout(rsT);
  rsT=setTimeout(function(){if(!playing&&S.pins.length)fitScope(0);scheduleCull();buildTl();},120);
}).observe($('#app'));

/* arranque */
buildCover();
$('#app').classList.toggle('log-open',panelOpen);
$('#btnLog').setAttribute('aria-expanded',String(panelOpen));
measure();drawBase();setScope(true);
runCounts(cover);coverGlobe();
setTimeout(function(){gReady(true);},2500);
requestAnimationFrame(function(){requestAnimationFrame(function(){$('#app').classList.remove('boot');});});
})();
